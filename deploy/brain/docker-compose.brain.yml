# Overlay Compose — tambah service "brain" ke stack utama.
# Jalankan bersama docker-compose.yml root dari root repo:
#
#   docker compose -f docker-compose.yml -f deploy/brain/docker-compose.brain.yml up -d --build
services:
  # Arahkan webhook WAHA langsung ke container brain, menimpa nilai
  # host.docker.internal:4000 dari docker-compose.yml root.
  #
  # Root compose mengasumsikan gateway berjalan NATIVE di host (dev Windows), jadi
  # WAHA harus memutar keluar lewat host.docker.internal. Pada mode brain (Opsi A)
  # gateway ada di dalam container pada jaringan compose yang sama, sehingga
  # host.docker.internal justru merugikan: di Linux ia menunjuk 172.17.0.1 (bridge
  # docker0) dan paket dibuang firewall host → WAHA gagal kirim webhook dengan
  # "connect ETIMEDOUT 172.17.0.1:4000" dan pesan masuk tak pernah sampai.
  # Memanggil `brain:4000` langsung menghapus lompatan ke host itu sepenuhnya.
  waha:
    environment:
      WHATSAPP_HOOK_URL: http://brain:4000/webhook/waha

  brain:
    build:
      context: .
      dockerfile: deploy/brain/Dockerfile
    image: pa-ai/brain:local
    container_name: pa_ai_brain
    env_file:
      - .env
    environment:
      GATEWAY_PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: pa_ai
      DB_NAME: pa_ai
      REDIS_ADDR: redis:6379
      WAHA_URL: http://waha:3000
      OPENCLAW_BIN: openclaw
      OPENCLAW_AGENT: pa_communicator
    volumes:
      - ${OPENCLAW_STATE_DIR:-./data/openclaw}:/home/claw/.openclaw
      # Kredensial OAuth Claude Code. Binary `claude` ikut image, tetapi sesi login-nya
      # tersimpan di ~/.claude — TANPA volume ini, auth hilang setiap container dibuat
      # ulang (dan `up -d` membuat ulang container), sehingga bot mati diam-diam pada
      # deploy berikutnya. Login cukup SEKALI: lihat deploy/brain/README.md.
      - ${CLAUDE_STATE_DIR:-./data/claude}:/home/claw/.claude
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/metrics >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
