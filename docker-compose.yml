services:

  # ─── Storage ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pa_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    environment:
      TZ: Asia/Jakarta
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: pa_ai_postgres
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: pa_ai
      POSTGRES_USER: pa_ai
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: Asia/Jakarta
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pa_ai -d pa_ai"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Transport ─────────────────────────────────────────────
  waha:
    # Engine GOWS (Go/whatsmeow, browser-free)
    image: devlikeapro/waha:gows
    container_name: pa_ai_waha
    ports:
      - "13000:3000"
    volumes:
      - ./.waha:/app/.sessions
    environment:
      TZ: Asia/Jakarta
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_HOOK_URL: http://host.docker.internal:4000/webhook/waha
      WHATSAPP_HOOK_EVENTS: message
      WAHA_LOG_LEVEL: info
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ─── Monitoring (Fase M1) ──────────────────────────────────
  # Gateway berjalan NATIVE di host (port 4000)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pa_ai_prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
    restart: unless-stopped

  # Alertmanager (Fase M3b): terima alert dari Prometheus, kirim email lewat
  # webhook gateway (/internal/alerts).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pa_ai_alertmanager
    ports:
      - "19093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/webhook_token:/etc/alertmanager/webhook_token:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pa_ai_grafana
    ports:
      - "13001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Dipakai provisioning datasource Postgres (monitoring/grafana/provisioning).
      PA_DB_HOST: postgres:5432
      PA_DB_NAME: pa_ai
      PA_DB_USER: pa_ai
      PA_DB_PASS: ${DB_PASS}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped

  # ─── Monitoring exporters ────────
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pa_ai_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://pa_ai:${DB_PASS}@postgres:5432/pa_ai?sslmode=disable"
    depends_on:
      - postgres
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: pa_ai_redis_exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: pa_ai_cadvisor
    # Metrik per-container. Di Docker Desktop/WSL2 sifatnya best-effort; jika
    # container gagal start, hentikan saja — dashboard host & DB tetap jalan.
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

# ─── Volume data monitoring ──────────────────────────────────
volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
