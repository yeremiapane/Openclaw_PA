# Provisioning dashboard Grafana (Fase M1): muat semua dashboard JSON dari folder.
apiVersion: 1

providers:
  - name: PA AI
    orgId: 1
    folder: PA AI
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
