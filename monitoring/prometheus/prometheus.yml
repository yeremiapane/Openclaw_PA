# Prometheus — konfigurasi scrape (Fase M1 + M2 monitoring).
# Berkas ini dipakai SEMUA mode deploy. Yang berbeda antar-mode hanyalah ALAMAT
# target host (api-gateway & windows-host); itu di-inject lewat targets/*.json,
# bukan dengan menyalin berkas ini. Postgres/Redis/container di-scrape lewat
# exporter (M2).
# Exporter tak perlu port host: Prometheus menjangkaunya via nama service di
# jaringan compose. windows_exporter WAJIB dipasang native di host Windows
# (bukan container) dan mendengarkan di :9182 — lihat monitoring/README.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (Fase M3).
rule_files:
  - /etc/prometheus/alerts.yml

# Kirim alert yang menyala ke Alertmanager (Fase M3b) → email via webhook gateway.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus memantau dirinya sendiri.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API Gateway PA AI. ALAMATNYA BERBEDA per-mode deploy, jadi daftar targetnya
  # dipisah ke berkas agar overlay bisa menimpa alamat saja tanpa menyalin seluruh
  # config ini (salinan penuh pasti melenceng begitu ada job baru):
  #   dev   → monitoring/prometheus/targets/  (gateway native di host Windows)
  #   brain → deploy/brain/targets/           (gateway di dalam container)
  # Prometheus memuat ulang berkas ini sendiri; tak perlu restart.
  - job_name: api-gateway
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/api-gateway.json"]

  # ─── Fase M2 — Infrastruktur ─────────────────────────────────
  # Postgres (data KRITIS): koneksi, commit/rollback, ukuran DB, dsb.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # Redis: klien, memori, ops/detik, hit/miss.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  # cAdvisor: CPU/memori/IO PER-CONTAINER (best-effort di Docker Desktop/WSL2).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  # windows_exporter: CPU/RAM/disk FISIK host Windows. Dipasang native di host
  # (service Windows), BUKAN container. Jika belum terpasang, target ini "down"
  # tanpa mengganggu yang lain.
  # Di server LINUX exporter ini tak ada sama sekali, jadi overlay brain menimpanya
  # dengan daftar KOSONG — target yang merah selamanya melatih orang mengabaikan
  # warna merah, dan itu jauh lebih berbahaya daripada tak punya metrik host.
  - job_name: windows-host
    file_sd_configs:
      - files: ["/etc/prometheus/targets/windows-host.json"]
